<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Middle-earth Reading Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Cinzel:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="map-wrapper">
    <svg id="map" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Map of Middle-earth"></svg>

    <div id="panel">
      <h1>Middle-earth<br /><span>Reading Tracker</span></h1>

      <label for="book-select">Book</label>
      <select id="book-select"></select>

      <label for="chapter-select">Chapter</label>
      <select id="chapter-select"></select>

      <div class="buttons">
        <button id="update-btn" type="button">Update map</button>
        <button id="fullscreen-btn" type="button">Fullscreen</button>
      </div>

      <label class="check"><input type="checkbox" id="scene-toggle" checked />
      Fly camera to each chapter's scene</label>

      <div id="legend"></div>

      <p class="hint">Scroll to zoom · drag to pan · double-click for the whole map.<br />
      Faded markers = whereabouts uncertain.</p>
      <p class="credit">Character icons by Lorc, Delapouite, Cathelineau &amp; Kier Heyl
      via <a href="https://game-icons.net" target="_blank" rel="noopener">game-icons.net</a>
      (<a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a>)</p>
    </div>

    <div id="caption"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
